<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>PC Szerviz | Építő</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">PC <span>SZERVIZ</span></div>
        <div class="nav-links">
            <a href="#">Gépépítő</a>
            <a href="#">Termékek</a>
            <a href="#">Útmutatók</a>
        </div>
        <button class="login-btn">Bejelentkezés</button>
    </nav>

    <div class="container">
        <header class="hero">
            <h1>Válogass alkatrészeket. Építs PC-t.</h1>
            <p>Segítünk az alkatrészek kiválasztásában és az összeférhetőség ellenőrzésében.</p>
            <button class="start-btn">Építés megkezdése</button>
        </header>

        <div class="compatibility-alert">
            <span class="icon">✔</span> Kompatibilitás: Nem találtunk hibát az összeállításban.
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Alkatrész</th>
                        <th>Kiválasztott elem</th>
                        <th>Ár</th>
                        <th>Webáruház</th>
                        <th>Művelet</th>
                    </tr>
                </thead>
                <tbody id="termek-lista">
                    <!-- Itt jelennek meg a termékek -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
